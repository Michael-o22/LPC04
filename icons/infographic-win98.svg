<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="48" height="48" shape-rendering="crispEdges">
  <!-- Windows 98 Tripod Easel Legs -->
  <path d="M15 25h2v6h-2z" fill="#404040"/>
  <path d="M14 25h1v6h-1zM17 25h1v6h-1z" fill="#000000"/>
  <!-- Left Leg -->
  <path d="M11 25h2l-3 6h-2z" fill="#404040"/>
  <path d="M10 25h1l-3 6h-1zM13 25h1l-3 6h-1z" fill="#000000"/>
  <!-- Right Leg -->
  <path d="M19 25h2l3 6h-2z" fill="#404040"/>
  <path d="M18 25h1l3 6h-1zM21 25h1l3 6h-1z" fill="#000000"/>

  <!-- Top Peg / Hanger -->
  <rect x="14" y="2" width="4" height="2" fill="#808080"/>
  <rect x="14" y="2" width="4" height="1" fill="#c0c0c0"/>
  <path d="M13 2h1v2h-1zM18 2h1v2h-1zM14 1h4v1h-4z" fill="#000000"/>

  <!-- Top Horizontal Bar -->
  <rect x="3" y="4" width="26" height="3" fill="#808080"/>
  <rect x="4" y="4" width="24" height="1" fill="#ffffff"/>
  <rect x="4" y="6" width="24" height="1" fill="#404040"/>
  <rect x="3" y="4" width="1" height="3" fill="#000000"/>
  <rect x="28" y="4" width="1" height="3" fill="#000000"/>
  <rect x="3" y="3" width="26" height="1" fill="#000000"/>

  <!-- Board White Area -->
  <rect x="4" y="7" width="24" height="16" fill="#ffffff"/>
  <rect x="4" y="7" width="1" height="16" fill="#000000"/>
  <rect x="27" y="7" width="1" height="16" fill="#000000"/>

  <!-- Light Gray Grid Lines -->
  <path d="M6 10h20v1H6zM6 14h20v1H6zM6 18h20v1H6z" fill="#e0e0e0"/>
  <path d="M10 8v14h1V8zM15 8v14h1V8zM20 8v14h1V8z" fill="#e0e0e0"/>

  <!-- Y-Axis and X-Axis Base Lines -->
  <path d="M6 9v13h18v1H6z" fill="#000000"/>

  <!-- 3D Bar Charts -->
  <!-- Bar 1: Blue -->
  <rect x="8" y="16" width="2" height="6" fill="#0000aa"/>
  <rect x="8" y="16" width="2" height="1" fill="#5555ff"/>
  <rect x="10" y="16" width="1" height="6" fill="#000055"/>
  <rect x="7" y="15" width="4" height="1" fill="#000000"/>
  <rect x="7" y="16" width="1" height="6" fill="#000000"/>

  <!-- Bar 2: Green -->
  <rect x="12" y="13" width="2" height="9" fill="#00aa00"/>
  <rect x="12" y="13" width="2" height="1" fill="#55ff55"/>
  <rect x="14" y="13" width="1" height="9" fill="#005500"/>
  <rect x="11" y="12" width="4" height="1" fill="#000000"/>
  <rect x="11" y="13" width="1" height="9" fill="#000000"/>

  <!-- Bar 3: Yellow/Amber -->
  <rect x="16" y="10" width="2" height="12" fill="#ffaa00"/>
  <rect x="16" y="10" width="2" height="1" fill="#ffff55"/>
  <rect x="18" y="10" width="1" height="12" fill="#aa5500"/>
  <rect x="15" y="9" width="4" height="1" fill="#000000"/>
  <rect x="15" y="10" width="1" height="12" fill="#000000"/>

  <!-- Pie Chart (Multi-colored sectors) -->
  <path d="M21 13h4v4h-4z" fill="#0000aa"/>
  <path d="M21 17h4v4h-4z" fill="#00aa00"/>
  <path d="M25 13h2v4h-2z" fill="#aa0000"/>
  <path d="M25 17h2v4h-2z" fill="#ffcc00"/>
  <!-- Pie Circular Outline -->
  <path d="M22 12h3v1h-3zM21 13h1v1h-1zM25 13h1v1h-1zM20 14h1v4h-1zM26 14h1v4h-1zM21 18h1v1h-1zM25 18h1v1h-1zM22 19h3v1h-3z" fill="#000000"/>
  <!-- Center Divide Lines -->
  <path d="M23 13v6h1v-6zM21 16h6v1h-6z" fill="#000000"/>

  <!-- Upward Trend Line (Red Arrow) -->
  <path d="M7 15l4-4 4 2 5-4" stroke="#ff0000" stroke-width="1.5" fill="none"/>
  <!-- Arrow Head -->
  <path d="M20 9h3v3h-1v-1h-1v-1h-1z" fill="#ff0000"/>

  <!-- Bottom Tray / Frame Shelf -->
  <rect x="3" y="23" width="26" height="3" fill="#c0c0c0"/>
  <rect x="4" y="23" width="24" height="1" fill="#ffffff"/>
  <rect x="4" y="25" width="24" height="1" fill="#404040"/>
  <rect x="3" y="23" width="1" height="3" fill="#000000"/>
  <rect x="28" y="23" width="1" height="3" fill="#000000"/>
  <rect x="3" y="26" width="26" height="1" fill="#000000"/>

  <!-- Colorful Dry Erase Markers on Shelf -->
  <rect x="8" y="24" width="3" height="1" fill="#ff0000"/>
  <rect x="13" y="24" width="3" height="1" fill="#0000aa"/>
  <rect x="18" y="24" width="3" height="1" fill="#00aa00"/>

  <!-- Authentic Windows 98 Shortcut Overlay Arrow (Bottom-Left) -->
  <rect x="1" y="22" width="9" height="9" fill="#ffffff" stroke="#000000" stroke-width="1"/>
  <path d="M2 28l3-3v2h2v-4h-4v2h2l-3 3z" fill="#0000aa"/>
  <path d="M3 27l2-2v1h2v-2h-2v1l-2 2z" fill="#000000"/>
</svg>
