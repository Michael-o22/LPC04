<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="48" height="48" shape-rendering="crispEdges">
  <!-- Propeller Blades (Spinning discs/rotors) -->
  <!-- Top Left Rotor -->
  <path d="M4 5h7v1H4zM6 4h3v3H6z" fill="#a0a0a0"/>
  <rect x="7" y="5" width="1" height="1" fill="#ffffff"/>
  <circle cx="7.5" cy="5.5" r="3.5" fill="none" stroke="#404040" stroke-width="0.8"/>

  <!-- Top Right Rotor -->
  <path d="M21 5h7v1h-7zM23 4h3v3h-3z" fill="#a0a0a0"/>
  <rect x="24" y="5" width="1" height="1" fill="#ffffff"/>
  <circle cx="24.5" cy="5.5" r="3.5" fill="none" stroke="#404040" stroke-width="0.8"/>

  <!-- Bottom Left Rotor -->
  <path d="M4 22h7v1H4zM6 21h3v3H6z" fill="#a0a0a0"/>
  <rect x="7" y="22" width="1" height="1" fill="#ffffff"/>
  <circle cx="7.5" cy="22.5" r="3.5" fill="none" stroke="#404040" stroke-width="0.8"/>

  <!-- Bottom Right Rotor -->
  <path d="M21 22h7v1h-7zM23 21h3v3h-3z" fill="#a0a0a0"/>
  <rect x="24" y="22" width="1" height="1" fill="#ffffff"/>
  <circle cx="24.5" cy="22.5" r="3.5" fill="none" stroke="#404040" stroke-width="0.8"/>

  <!-- Drone Diagonal Carbon Arms -->
  <path d="M8 6l6 6h1v-1l-6-6z" fill="#303030"/>
  <path d="M23 6l-6 6h-1v-1l6-6z" fill="#303030"/>
  <path d="M8 21l6-6h1v1l-6 6z" fill="#303030"/>
  <path d="M23 21l-6-6h-1v1l6 6z" fill="#303030"/>

  <!-- Drone Body / Chassis (Windows 98 Metallic Silver/White) -->
  <path d="M12 11h8v6h-8z" fill="#d4d0c8"/>
  <path d="M13 11h6v1h-6zM12 12h1v4h-1z" fill="#ffffff"/>
  <path d="M19 12h1v4h-1zM13 16h6v1h-6z" fill="#808080"/>
  <!-- Body Outer Outline -->
  <path d="M13 10h6v1h-6zM13 17h6v1h-6zM11 12h1v4h-1zM20 12h1v4h-1z" fill="#000000"/>

  <!-- Power / GPS LED Indicators -->
  <rect x="13" y="12" width="2" height="1" fill="#00ff00"/>
  <rect x="17" y="12" width="2" height="1" fill="#ff0000"/>

  <!-- Survey Camera Gimbal (Center/Bottom) -->
  <circle cx="16" cy="14.5" r="2.5" fill="#101010"/>
  <circle cx="16" cy="14.5" r="1.5" fill="#0080ff"/>
  <rect x="15.5" y="14" width="1" height="1" fill="#ffffff"/>

  <!-- Authentic Windows 98 Shortcut Overlay Arrow (Bottom-Left) -->
  <rect x="1" y="22" width="9" height="9" fill="#ffffff" stroke="#000000" stroke-width="1"/>
  <path d="M2 28l3-3v2h2v-4h-4v2h2l-3 3z" fill="#0000aa"/>
  <path d="M3 27l2-2v1h2v-2h-2v1l-2 2z" fill="#000000"/>
</svg>
