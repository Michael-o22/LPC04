<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>RetroLink OS - Interactive Showcase Hub</title>
  <style>
    /* =========================================================
       1. RETRO 90s BASE STYLES & CRT SHADER
       ========================================================= */
    :root {
      --desktop-bg: #008080; /* Classic Win95 Teal */
      --win-gray: #c0c0c0;
      --win-light: #ffffff;
      --win-dark: #808080;
      --win-darkest: #000000;
      --title-blue: linear-gradient(90deg, #000080, #1084d0);
      --title-inactive: linear-gradient(90deg, #808080, #a0a0a0);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: 'MS Sans Serif', Tahoma, 'Segoe UI', -apple-system, sans-serif;
      font-size: 12px;
      background-color: var(--desktop-bg);
      background-image: url('thumb-1920-1161622.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      position: relative;
    }

    /* CRT Scanline & Screen Glow Overlay */
    #crt-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.22) 50%),
                  linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
      background-size: 100% 3px, 6px 100%;
      z-index: 999999;
      opacity: 0.75;
      transition: opacity 0.2s;
    }

    /* =========================================================
       2. RETRO BEVEL BORDERS (Windows 95/98 3D Look)
       ========================================================= */
    .bevel-raised {
      border: 2px solid;
      border-color: var(--win-light) var(--win-darkest) var(--win-darkest) var(--win-light);
      background-color: var(--win-gray);
    }

    .bevel-sunken {
      border: 2px solid;
      border-color: var(--win-darkest) var(--win-light) var(--win-light) var(--win-darkest);
      background-color: var(--win-light);
    }

    .btn-retro {
      border: 2px solid;
      border-color: var(--win-light) var(--win-darkest) var(--win-darkest) var(--win-light);
      background: var(--win-gray);
      padding: 3px 8px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      outline: none;
    }

    .btn-retro:active, .btn-retro.active-pressed {
      border-color: var(--win-darkest) var(--win-light) var(--win-light) var(--win-darkest);
      padding: 4px 7px 2px 9px;
    }

    /* =========================================================
       3. DESKTOP & ICONS
       ========================================================= */
    #desktop {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 32px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      flex-wrap: wrap;
      align-content: flex-start;
      gap: 16px;
      overflow: hidden;
    }

    .desktop-icon {
      width: 78px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      cursor: pointer;
      padding: 6px 4px;
      border-radius: 2px;
      transition: background 0.1s;
    }

    .desktop-icon:hover {
      background: rgba(255, 255, 255, 0.18);
    }

    .desktop-icon.selected {
      background: rgba(0, 0, 128, 0.65);
      outline: 1px dotted rgba(255, 255, 255, 0.8);
    }

    .desktop-icon .icon-img {
      font-size: 34px;
      line-height: 1;
      margin-bottom: 6px;
      filter: drop-shadow(2px 2px 0px rgba(0,0,0,0.5));
      display: flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
    }

    .retro-icon-img {
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      object-fit: contain;
      pointer-events: none;
      vertical-align: middle;
      display: inline-block;
    }

    .desktop-icon .icon-label {
      color: #ffffff;
      font-size: 11px;
      text-shadow: 1px 1px 2px #000000;
      word-break: break-word;
      line-height: 1.2;
    }

    /* =========================================================
       4. WINDOW SYSTEM & RESIZE HANDLERS
       ========================================================= */
    .win-window {
      position: absolute;
      min-width: 280px;
      min-height: 180px;
      display: flex;
      flex-direction: column;
      box-shadow: 3px 3px 12px rgba(0, 0, 0, 0.45);
      z-index: 100;
      touch-action: none;
    }

    .win-titlebar {
      height: 26px;
      background: var(--title-blue);
      color: white;
      padding: 2px 4px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: move;
      font-weight: bold;
      touch-action: none;
    }

    .win-window.inactive .win-titlebar {
      background: var(--title-inactive);
      color: #e0e0e0;
    }

    .title-left {
      display: flex;
      align-items: center;
      gap: 6px;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      pointer-events: none;
    }

    .title-controls {
      display: flex;
      gap: 3px;
      pointer-events: auto;
    }

    .win-btn {
      width: 18px;
      height: 18px;
      font-size: 11px;
      line-height: 1;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--win-gray);
      border: 1.5px solid;
      border-color: var(--win-light) var(--win-darkest) var(--win-darkest) var(--win-light);
      cursor: pointer;
      font-weight: bold;
    }

    .win-btn:active {
      border-color: var(--win-darkest) var(--win-light) var(--win-light) var(--win-darkest);
    }

    .win-content {
      flex: 1;
      padding: 10px;
      overflow-y: auto;
      background: #c0c0c0;
      touch-action: auto;
      user-select: text;
      -webkit-user-select: text;
    }

    /* Resize Handles (8 directions) */
    .win-resize-handle {
      position: absolute;
      z-index: 15;
      touch-action: none;
    }

    .win-resize-n { top: -4px; left: 6px; right: 6px; height: 7px; cursor: ns-resize; }
    .win-resize-s { bottom: -4px; left: 6px; right: 6px; height: 7px; cursor: ns-resize; }
    .win-resize-w { left: -4px; top: 6px; bottom: 6px; width: 7px; cursor: ew-resize; }
    .win-resize-e { right: -4px; top: 6px; bottom: 6px; width: 7px; cursor: ew-resize; }
    .win-resize-nw { top: -4px; left: -4px; width: 12px; height: 12px; cursor: nwse-resize; }
    .win-resize-ne { top: -4px; right: -4px; width: 12px; height: 12px; cursor: nesw-resize; }
    .win-resize-sw { bottom: -4px; left: -4px; width: 12px; height: 12px; cursor: nesw-resize; }
    .win-resize-se { bottom: -4px; right: -4px; width: 12px; height: 12px; cursor: nwse-resize; }

    .win-window.is-maximized .win-resize-handle {
      display: none !important;
    }

    /* =========================================================
       5. SHOWCASE APP SPECIFIC STYLES
       ========================================================= */
    .project-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 12px;
    }

    .project-card {
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      background: #ffffff;
      border: 2px solid;
      border-color: var(--win-darkest) var(--win-light) var(--win-light) var(--win-darkest);
    }

    .project-card.featured-card {
      border: 2px solid;
      border-color: #000080 var(--win-light) var(--win-light) #000080;
      background: #f4f8ff;
      box-shadow: 2px 2px 8px rgba(0, 0, 128, 0.15);
    }

    .featured-badge {
      background: #000080;
      color: #ffeb3b;
      font-size: 9px;
      font-weight: bold;
      padding: 1px 6px;
      border: 1px solid #000050;
      letter-spacing: 0.5px;
      display: inline-block;
    }

    .project-header {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .project-header .proj-icon {
      font-size: 24px;
    }

    .project-title {
      font-size: 13px;
      font-weight: bold;
      color: #000080;
    }

    .project-desc {
      font-size: 11px;
      color: #333333;
      line-height: 1.4;
      flex: 1;
    }

    .project-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }

    .tag-badge {
      font-size: 9px;
      background: #e0e0e0;
      padding: 1px 4px;
      border: 1px solid #808080;
    }

    /* Tools Hub Specific Styles */
    .tool-item-card {
      background: #ffffff;
      border: 2px solid;
      border-color: var(--win-darkest) var(--win-light) var(--win-light) var(--win-darkest);
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      position: relative;
      cursor: pointer;
      transition: background 0.1s;
    }
    .tool-item-card:hover {
      background: #f8fbff;
    }
    .tool-item-card.is-selected {
      background: #eef4ff;
      border-color: #000080 var(--win-light) var(--win-light) #000080;
      box-shadow: inset 1px 1px 0px #000080, inset -1px -1px 0px #000080;
    }
    .tool-item-card.featured-tool {
      border: 2px solid;
      border-color: #000080 var(--win-light) var(--win-light) #000080;
      background: #f6faff;
      box-shadow: 1px 1px 5px rgba(0, 0, 128, 0.12);
    }
    .tool-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 11px;
    }
    .tool-table th {
      background: #dfdfdf;
      padding: 4px 6px;
      text-align: left;
      border-right: 1px solid #808080;
      border-bottom: 1px solid #808080;
      font-weight: bold;
      position: sticky;
      top: 0;
      z-index: 2;
    }
    .tool-table td {
      padding: 5px 6px;
      border-bottom: 1px dotted #ccc;
      vertical-align: middle;
      cursor: pointer;
    }
    .tool-table tr:hover td {
      background: #000080;
      color: #ffffff;
    }
    .tool-table tr:hover td a, .tool-table tr:hover td button {
      color: #ffffff;
    }
    .tool-table tr.is-selected td {
      background: #000080;
      color: #ffffff;
    }
    .tool-modal-backdrop {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.4);
      z-index: 500;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
    }

    /* =========================================================
       6. TASKBAR & START MENU
       ========================================================= */
    #taskbar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 32px;
      background: var(--win-gray);
      border-top: 2px solid var(--win-light);
      display: flex;
      align-items: center;
      padding: 2px 4px;
      gap: 6px;
      z-index: 9999;
    }

    #start-btn {
      font-weight: bold;
      font-size: 12px;
      height: 25px;
      padding: 0 8px;
    }

    #taskbar-windows {
      flex: 1;
      display: flex;
      gap: 4px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    #taskbar-windows::-webkit-scrollbar { display: none; }

    .taskbar-item {
      max-width: 170px;
      min-width: 110px;
      height: 25px;
      padding: 0 8px;
      font-size: 11px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .taskbar-item.active {
      border-color: var(--win-darkest) var(--win-light) var(--win-light) var(--win-darkest);
      background: #e6e6e6;
      font-weight: bold;
      box-shadow: inset 1px 1px 1px #000000;
    }

    #system-tray {
      height: 25px;
      padding: 0 8px;
      display: flex;
      align-items: center;
      gap: 8px;
      border: 2px solid;
      border-color: var(--win-dark) var(--win-light) var(--win-light) var(--win-dark);
      font-size: 11px;
    }

    /* Volume Popup Dialog */
    #volume-popup {
      position: absolute;
      bottom: 34px;
      right: 8px;
      width: 160px;
      background: var(--win-gray);
      box-shadow: 3px 3px 10px rgba(0, 0, 0, 0.4);
      z-index: 10001;
      display: none;
      flex-direction: column;
    }

    .volume-header {
      background: var(--title-blue);
      color: white;
      font-weight: bold;
      font-size: 11px;
      padding: 2px 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .volume-body {
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: center;
    }

    .volume-slider-box {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
    }

    .volume-slider-box input[type="range"] {
      flex: 1;
      accent-color: #000080;
      cursor: pointer;
    }

    /* Start Menu */
    #start-menu {
      position: absolute;
      bottom: 34px;
      left: 4px;
      width: 220px;
      display: none;
      box-shadow: 4px 4px 12px rgba(0, 0, 0, 0.45);
      z-index: 10000;
    }

    .start-sidebar {
      background: linear-gradient(180deg, #000080, #1084d0);
      color: white;
      writing-mode: vertical-rl;
      transform: rotate(180deg);
      padding: 14px 6px;
      font-weight: bold;
      font-size: 16px;
      letter-spacing: 2px;
    }

    .start-items {
      flex: 1;
      padding: 4px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .start-item {
      padding: 6px 10px;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
    }

    .start-item:hover {
      background: #000080;
      color: white;
    }

    /* Responsive Adjustments for Mobile */
    @media (max-width: 600px) {
      .win-window {
        min-width: 260px;
      }
      .taskbar-item {
        max-width: 120px;
        min-width: 80px;
        font-size: 10px;
      }
      #system-tray {
        padding: 0 4px;
        gap: 5px;
      }
      .desktop-icon {
        width: 68px;
      }
    }
  </style>
</head>
<body>

  <!-- CRT Shader Overlay (Toggleable) -->
  <div id="crt-overlay"></div>

  <!-- DESKTOP WORKSPACE -->
  <div id="desktop">
    <!-- Desktop Icons rendered by JS -->
  </div>

  <!-- TASKBAR -->
  <div id="taskbar">
    <button class="btn-retro" id="start-btn" onclick="toggleStartMenu(event)">
      <span style="font-size: 14px;">🪟</span> <strong>Start</strong>
    </button>
    <div id="taskbar-windows"></div>
    <div id="system-tray">
      <span id="sound-indicator" style="cursor: pointer;" title="Volume Settings" onclick="toggleVolumePopup(event)">🔊</span>
      <span id="clock">12:00 PM</span>
    </div>
  </div>

  <!-- VOLUME POPUP (Authentic Retro Sound Control) -->
  <div id="volume-popup" class="bevel-raised">
    <div class="volume-header">
      <span>Master Volume</span>
      <button class="win-btn" style="width: 14px; height: 14px; font-size: 8px;" onclick="closeVolumePopup()">✕</button>
    </div>
    <div class="volume-body">
      <div class="volume-slider-box">
        <span>🔈</span>
        <input type="range" id="volume-slider" min="0" max="100" value="60" oninput="handleVolumeChange(this.value)">
        <span>🔊</span>
      </div>
      <div style="font-size: 10px; font-weight: bold;" id="volume-level-text">60%</div>
      <div style="display: flex; gap: 8px; width: 100%; justify-content: space-between; align-items: center;">
        <label style="display: flex; align-items: center; gap: 4px; font-size: 11px; cursor: pointer;">
          <input type="checkbox" id="mute-checkbox" onchange="toggleMute(this.checked)"> Mute
        </label>
        <button class="btn-retro" style="font-size: 10px; padding: 2px 5px;" onclick="testBeep()">Beep 🎵</button>
      </div>
    </div>
  </div>

  <!-- START MENU -->
  <div id="start-menu" class="bevel-raised">
    <div style="display: flex;">
      <div class="start-sidebar">RETROLINK 98</div>
      <div class="start-items">
        <div class="start-item" onclick="openWindow('projects'); closeStartMenu();">
          <span>📁</span> <span>UAV</span>
        </div>
        <div class="start-item" onclick="soundOpen(); window.open('https://demo-condomap.40.co.th/', '_blank'); closeStartMenu();">
          <img src="icons/condo-win98.svg" class="retro-icon-img" style="width: 16px; height: 16px;" alt="Condomaps"> <span>Condomaps ↗</span>
        </div>
        <div class="start-item" onclick="soundOpen(); window.open('https://bpt.dol.go.th/dol/', '_blank'); closeStartMenu();">
          <img src="icons/dol-win98.svg" class="retro-icon-img" style="width: 16px; height: 16px;" alt="LPC DOL"> <span>LPC DOL ↗</span>
        </div>
        <div class="start-item" onclick="soundOpen(); window.open('https://drive.google.com/drive/folders/1g8UVBAg40uOT-r68EFXK48Q6h_RFRqij?usp=drive_link', '_blank'); closeStartMenu();">
          <img src="icons/storage-win98.svg" class="retro-icon-img" style="width: 16px; height: 16px;" alt="Storage"> <span>Storage (Drive) ↗</span>
        </div>
        <div class="start-item" onclick="openWindow('tools'); closeStartMenu();">
          <img src="icons/tools-win98.svg" class="retro-icon-img" style="width: 16px; height: 16px;" alt="Tools"> <span>Tools</span>
        </div>
        <hr style="border-top: 1px solid var(--win-dark); border-bottom: 1px solid var(--win-light); margin: 2px 0;">
        <div class="start-item" onclick="soundOpen(); window.open('https://getartcraft.com/apps', '_blank'); closeStartMenu();" style="font-weight: bold; color: #000080;">
          <img src="icons/artcraft-win98.svg" class="retro-icon-img" style="width: 16px; height: 16px;" alt="ArtCraft"> <span>ArtCraft Apps ↗</span>
        </div>
        <div class="start-item" onclick="soundOpen(); window.open('https://www.canva.com/', '_blank'); closeStartMenu();" style="font-weight: bold; color: #000080;">
          <img src="icons/canva-win98.svg" class="retro-icon-img" style="width: 16px; height: 16px;" alt="Canva"> <span>Canva Studio ↗</span>
        </div>
        <hr style="border-top: 1px solid var(--win-dark); border-bottom: 1px solid var(--win-light); margin: 2px 0;">
        <div class="start-item" onclick="soundOpen(); window.open('https://michael-o22.github.io/All-UAV04/', '_blank'); closeStartMenu();" style="font-weight: bold; color: #000080;">
          <img src="icons/uav-win98.svg" class="retro-icon-img" style="width: 16px; height: 16px;" alt="UAV"> <span>NLPC.04 UAV Tracker ↗</span>
        </div>
        <div class="start-item" onclick="soundOpen(); window.open('https://workload01.my.canva.site/lpc04', '_blank'); closeStartMenu();" style="font-weight: bold; color: #000080;">
          <img src="icons/infographic-win98.svg" class="retro-icon-img" style="width: 16px; height: 16px;" alt="Infographic"> <span>LPC.04 Infographic ↗</span>
        </div>
        <div class="start-item" onclick="openWindow('readme'); closeStartMenu();">
          <span>📝</span> <span>About Me (Readme)</span>
        </div>
        <div class="start-item" onclick="openWindow('pong'); closeStartMenu();">
          <span>🕹️</span> <span>Mini-Game (Pong)</span>
        </div>
        <div class="start-item" onclick="openWindow('settings'); closeStartMenu();">
          <span>⚙️</span> <span>Display Settings</span>
        </div>
        <hr style="border-top: 1px solid var(--win-dark); border-bottom: 1px solid var(--win-light); margin: 4px 0;">
        <div class="start-item" onclick="simulateShutdown()">
          <span>🔌</span> <span>Shut Down...</span>
        </div>
      </div>
    </div>
  </div>

  <!-- JAVASCRIPT LOGIC -->
  <script>
    /* =========================================================
       1. DATA CONFIGURATION
       ========================================================= */
    function getIconHtml(icon, size = 38) {
      if (typeof icon === 'string' && (icon.endsWith('.svg') || icon.endsWith('.png') || icon.endsWith('.jpg') || icon.includes('/'))) {
        return `<img src="${icon}" class="retro-icon-img" style="width:${size}px;height:${size}px;" alt="icon" draggable="false">`;
      }
      return icon;
    }

    const APPS_DATA = [
      {
        id: "projects",
        title: "UAV",
        icon: "📁",
        type: "window",
        component: renderProjectsApp
      },
      {
        id: "condomaps",
        title: "Condomaps",
        icon: "icons/condo-win98.svg",
        type: "link",
        url: "https://demo-condomap.40.co.th/"
      },
      {
        id: "lpc_dol",
        title: "LPC DOL",
        icon: "icons/dol-win98.svg",
        type: "link",
        url: "https://bpt.dol.go.th/dol/"
      },
      {
        id: "storage",
        title: "Storage",
        icon: "icons/storage-win98.svg",
        type: "link",
        url: "https://drive.google.com/drive/folders/1g8UVBAg40uOT-r68EFXK48Q6h_RFRqij?usp=drive_link"
      },
      {
        id: "tools",
        title: "Tools",
        icon: "icons/tools-win98.svg",
        type: "window",
        component: renderToolsApp
      },
      {
        id: "nlpc_uav",
        title: "NLPC.04 UAV.url",
        icon: "icons/uav-win98.svg",
        type: "link",
        url: "https://michael-o22.github.io/All-UAV04/"
      },
      {
        id: "lpc04_canva",
        title: "LPC.04 Info.url",
        icon: "icons/infographic-win98.svg",
        type: "link",
        url: "https://workload01.my.canva.site/lpc04"
      },
      {

    /* =========================================================
       2. RETRO SOUND ENGINE (Multi-tone Synthesis & Volume)
       ========================================================= */
    let audioCtx = null;
    let soundVolume = 0.6;
    let soundEnabled = true;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playSynthNotes(notes) {
      if (!soundEnabled || soundVolume <= 0) return;
      initAudio();
      try {
        const now = audioCtx.currentTime;
        notes.forEach(n => {
          const startTime = now + (n.delay || 0);
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = n.type || 'square';
          osc.frequency.setValueAtTime(n.freq, startTime);
          
          const baseGain = (n.gain !== undefined ? n.gain : 0.08) * soundVolume;
          gain.gain.setValueAtTime(baseGain, startTime);
          gain.gain.exponentialRampToValueAtTime(0.0001, startTime + n.duration);
          
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(startTime);
          osc.stop(startTime + n.duration);
        });
      } catch (e) {}
    }

    function getEventPos(e) {
      if (e.touches && e.touches.length > 0) {
        return { x: e.touches[0].clientX, y: e.touches[0].clientY };
      }
      return { x: e.clientX, y: e.clientY };

    function openWindow(appId) {

        soundOpen();
        window.open(app.url, '_blank');
        return;

      if (activeWindows[appId]) {
        const winObj = activeWindows[appId];
        if (winObj.el.style.display === 'none') {
          winObj.el.style.display = 'flex';
        }
        bringToFront(appId);
        return;
      }

      soundOpen();
      highestZ += 2;
      const winEl = document.createElement('div');
      winEl.id = `window-${appId}`;
      winEl.dataset.appId = appId;
      winEl.className = 'win-window bevel-raised';
      winEl.style.zIndex = highestZ;

      // Responsive Initial Sizing
      const vw = window.innerWidth;
      const vh = window.innerHeight;
      const isMobile = vw <= 600;

      const isLargeWin = (appId === 'projects' || appId === 'condomaps' || appId === 'storage' || appId === 'tools');
      const defaultW = isMobile ? Math.min(vw - 20, 360) : (appId === 'projects' ? 520 : (isLargeWin ? 640 : 440));
      const defaultH = isMobile ? Math.min(vh - 80, 500) : (appId === 'tools' ? 335 : (appId === 'projects' ? 330 : (isLargeWin ? 480 : 360)));

      const offset = (Object.keys(activeWindows).length * 22) % 90;
      const leftPos = isMobile ? 10 : Math.min(vw - defaultW - 20, 80 + offset);
      const topPos = isMobile ? 15 : Math.min(vh - defaultH - 45, 50 + offset);

      winEl.style.width = `${defaultW}px`;
      winEl.style.height = `${defaultH}px`;
      winEl.style.left = `${Math.max(4, leftPos)}px`;
      winEl.style.top = `${Math.max(4, topPos)}px`;

      winEl.innerHTML = `
        <!-- 8 Resizing Handles -->
        <div class="win-resize-handle win-resize-n" data-dir="n"></div>
        <div class="win-resize-handle win-resize-s" data-dir="s"></div>
        <div class="win-resize-handle win-resize-w" data-dir="w"></div>
        <div class="win-resize-handle win-resize-e" data-dir="e"></div>
        <div class="win-resize-handle win-resize-nw" data-dir="nw"></div>
        <div class="win-resize-handle win-resize-ne" data-dir="ne"></div>
        <div class="win-resize-handle win-resize-sw" data-dir="sw"></div>
        <div class="win-resize-handle win-resize-se" data-dir="se"></div>

        <div class="win-titlebar" id="titlebar-${appId}">
          <div class="title-left">
            <span>${getIconHtml(app.icon, 16)}</span>
            <span>${app.id === 'tools' ? 'Tools — Work Applications' : app.title}</span>
          </div>
          <div class="title-controls">
            <button class="win-btn" title="Minimize" onclick="minimizeWindow('${appId}', event)">_</button>
            <button class="win-btn max-btn" title="Maximize/Restore" onclick="toggleMaximizeWindow('${appId}', event)">□</button>
            <button class="win-btn" title="Close" onclick="closeWindow('${appId}', event)">✕</button>
          </div>
        </div>
        <div class="win-content">
          ${app.component ? app.component() : 'Content loading...'}
        </div>
      `;

      document.body.appendChild(winEl);
      activeWindows[appId] = { el: winEl, isMaximized: false };

      const titleBarEl = document.getElementById(`titlebar-${appId}`);
      makeDraggable(winEl, titleBarEl);
      makeResizable(winEl);

      // Double click titlebar to toggle maximize
      titleBarEl.addEventListener('dblclick', (e) => {
        if (!e.target.closest('button')) {
          toggleMaximizeWindow(appId);
        }
      });

      winEl.addEventListener('mousedown', () => bringToFront(appId));
      winEl.addEventListener('touchstart', () => bringToFront(appId), { passive: true });

      bringToFront(appId);
    }

    function bringToFront(appId) {
      const win = activeWindows[appId];
      if (!win) return;

      highestZ += 1;
      win.el.style.zIndex = highestZ;
      currentFrontAppId = appId;

      // Update active/inactive styling
      document.querySelectorAll('.win-window').forEach(w => w.classList.add('inactive'));
      win.el.classList.remove('inactive');

      updateTaskbar();

    function closeWindow(appId, e) {
      if (e) e.stopPropagation();
      soundClose();
      if (activeWindows[appId]) {
        // Stop pong loop if closing pong
        if (appId === 'pong') {
          pongActive = false;
        }
        activeWindows[appId].el.remove();
        delete activeWindows[appId];
        if (currentFrontAppId === appId) currentFrontAppId = null;
        updateTaskbar();
      }
    }

    function minimizeWindow(appId, e) {
      if (e) e.stopPropagation();
      soundMinimize();
      const winObj = activeWindows[appId];
      if (winObj) {
        winObj.el.style.display = 'none';
        winObj.el.classList.add('inactive');
        if (currentFrontAppId === appId) {
          currentFrontAppId = null;
          // Focus remaining visible window if any
          const remaining = Object.keys(activeWindows).filter(id => activeWindows[id].el.style.display !== 'none');
          if (remaining.length > 0) {
            bringToFront(remaining[remaining.length - 1]);
          }
        }
        updateTaskbar();
      }
    }

    function toggleMaximizeWindow(appId, e) {
      if (e) e.stopPropagation();
      const winObj = activeWindows[appId];
      if (!winObj) return;

      const maxBtn = winObj.el.querySelector('.max-btn');

      if (!winObj.isMaximized) {
        soundMaximize();
        winObj.prevStyle = {
          top: winObj.el.style.top,
          left: winObj.el.style.left,
          width: winObj.el.style.width,
          height: winObj.el.style.height
        };
        winObj.el.style.top = '0px';
        winObj.el.style.left = '0px';
        winObj.el.style.width = '100vw';
        winObj.el.style.height = 'calc(100vh - 32px)';
        winObj.el.classList.add('is-maximized');
        winObj.isMaximized = true;
        if (maxBtn) maxBtn.textContent = '❐';
      } else {
        soundMinimize();
        winObj.el.style.top = winObj.prevStyle.top;
        winObj.el.style.left = winObj.prevStyle.left;
        winObj.el.style.width = winObj.prevStyle.width;
        winObj.el.style.height = winObj.prevStyle.height;
        winObj.el.classList.remove('is-maximized');
        winObj.isMaximized = false;
        if (maxBtn) maxBtn.textContent = '□';
      }
      bringToFront(appId);
    }

    /* Draggable Logic (Mouse + Touch Support & Clamping) */
    function makeDraggable(element, handle) {
      let startX = 0, startY = 0, initialLeft = 0, initialTop = 0;

      function onDragStart(e) {
        if (element.classList.contains('is-maximized')) return;
        if (e.target.closest('button')) return;

        const pos = getEventPos(e);
        startX = pos.x;
        startY = pos.y;
        initialLeft = element.offsetLeft;
        initialTop = element.offsetTop;

        window.addEventListener('mousemove', onDragMove, { passive: false });
        window.addEventListener('mouseup', onDragEnd);
        window.addEventListener('touchmove', onDragMove, { passive: false });
        window.addEventListener('touchend', onDragEnd);

        bringToFront(element.dataset.appId);
      }

      function onDragMove(e) {
        e.preventDefault();
        const pos = getEventPos(e);
        const dx = pos.x - startX;
        const dy = pos.y - startY;

        let newLeft = initialLeft + dx;
        let newTop = initialTop + dy;

        // Clamping inside viewport bounds
        const maxLeft = window.innerWidth - 60;
        const maxTop = window.innerHeight - 56;
        newLeft = Math.max(-element.offsetWidth + 100, Math.min(maxLeft, newLeft));
        newTop = Math.max(0, Math.min(maxTop, newTop));

        element.style.left = `${newLeft}px`;
        element.style.top = `${newTop}px`;
      }

      function onDragEnd() {
        window.removeEventListener('mousemove', onDragMove);
        window.removeEventListener('mouseup', onDragEnd);
        window.removeEventListener('touchmove', onDragMove);
        window.removeEventListener('touchend', onDragEnd);
      }

      handle.addEventListener('mousedown', onDragStart);
      handle.addEventListener('touchstart', onDragStart, { passive: false });
    }

    /* Resizable Logic (8 Handles, Mouse + Touch Support) */
    function makeResizable(element) {
      const handles = element.querySelectorAll('.win-resize-handle');
      handles.forEach(handle => {
        const dir = handle.dataset.dir;

        function onResizeStart(e) {
          if (element.classList.contains('is-maximized')) return;
          e.stopPropagation();
          e.preventDefault();

          const pos = getEventPos(e);
          const startX = pos.x;
          const startY = pos.y;
          const startW = element.offsetWidth;
          const startH = element.offsetHeight;
          const startL = element.offsetLeft;
          const startT = element.offsetTop;

          function onResizeMove(e) {
            e.preventDefault();
            const curPos = getEventPos(e);
            const dx = curPos.x - startX;
            const dy = curPos.y - startY;

            const minW = 280;
            const minH = 180;
            const maxW = window.innerWidth;
            const maxH = window.innerHeight - 34;

            let newW = startW;
            let newH = startH;
            let newL = startL;
            let newT = startT;

            if (dir.includes('e')) {
              newW = Math.min(maxW - startL, Math.max(minW, startW + dx));
            }
            if (dir.includes('s')) {
              newH = Math.min(maxH - startT, Math.max(minH, startH + dy));
            }
            if (dir.includes('w')) {
              const possibleW = startW - dx;
              if (possibleW >= minW) {
                newW = possibleW;
                newL = startL + dx;
              }
            }
            if (dir.includes('n')) {
              const possibleH = startH - dy;
              if (possibleH >= minH && (startT + dy) >= 0) {
                newH = possibleH;
                newT = startT + dy;
              }
            }

            element.style.width = `${newW}px`;
            element.style.height = `${newH}px`;
            element.style.left = `${newL}px`;
            element.style.top = `${newT}px`;
          }

          function onResizeEnd() {
            window.removeEventListener('mousemove', onResizeMove);
            window.removeEventListener('mouseup', onResizeEnd);
            window.removeEventListener('touchmove', onResizeMove);
            window.removeEventListener('touchend', onResizeEnd);
          }

          window.addEventListener('mousemove', onResizeMove, { passive: false });
          window.addEventListener('mouseup', onResizeEnd);
          window.addEventListener('touchmove', onResizeMove, { passive: false });
          window.addEventListener('touchend', onResizeEnd);
        }

        handle.addEventListener('mousedown', onResizeStart);
        handle.addEventListener('touchstart', onResizeStart, { passive: false });
      });
    }

    function updateTaskbar() {
      const container = document.getElementById('taskbar-windows');
      container.innerHTML = '';

      Object.keys(activeWindows).forEach(appId => {
        const app = APPS_DATA.find(a => a.id === appId);
        const winObj = activeWindows[appId];
        const isVisible = winObj.el.style.display !== 'none';
        const isCurrentFront = isVisible && currentFrontAppId === appId;

        const item = document.createElement('button');
        item.className = `btn-retro taskbar-item ${isCurrentFront ? 'active active-pressed' : ''}`;
        item.innerHTML = `<span>${getIconHtml(app.icon, 16)}</span> <span>${app.title}</span>`;

        item.onclick = (e) => {
          e.stopPropagation();
          soundClick();

          if (!isVisible) {
            // Restore from minimize
            winObj.el.style.display = 'flex';
            bringToFront(appId);
          } else if (isCurrentFront) {
            // Minimize if clicked while active
            minimizeWindow(appId);
          } else {
            // Bring to front
            bringToFront(appId);
          }
        };

        container.appendChild(item);
      });
    }

          <canvas id="pongCanvas" width="340" height="200" style="background: black; border: 2px solid white; max-width: 100%; height: auto; touch-action: none;"></canvas>
          <div style="font-size: 11px; margin-top: 8px; color: #222;">🎮 ใช้เมาส์เลื่อนขึ้น-ลง หรือแตะลากบนหน้าจอเพื่อบังคับไม้ตี</div>

    function initPongCanvas() {
      const cvs = document.getElementById('pongCanvas');
      if (!cvs) return;
      const ctx = cvs.getContext('2d');
      pongActive = true;

      let ballX = 170, ballY = 100, speedX = 3.2, speedY = 2.2;
      let playerY = 70, aiY = 70;

      function setPaddleY(clientY) {
        const rect = cvs.getBoundingClientRect();
        const scaleY = cvs.height / rect.height;
        playerY = (clientY - rect.top) * scaleY - 20;
        playerY = Math.max(0, Math.min(160, playerY));
      }

      cvs.onmousemove = (e) => setPaddleY(e.clientY);
      cvs.ontouchmove = (e) => {
        if (e.touches.length > 0) {
          e.preventDefault();
          setPaddleY(e.touches[0].clientY);
        }
      };

      function update() {
        if (!pongActive || !document.getElementById('pongCanvas')) {
          pongActive = false;
          return;
        }

        ballX += speedX;
        ballY += speedY;

        if (ballY <= 0 || ballY >= 192) {
          speedY = -speedY;
          playSynthNotes([{ freq: 440, type: 'triangle', duration: 0.02, gain: 0.04 }]);
        }

        // Player collision
        if (ballX <= 14 && ballY >= playerY && ballY <= playerY + 44) {
          speedX = Math.abs(speedX);
          playSynthNotes([{ freq: 659, type: 'square', duration: 0.03, gain: 0.05 }]);
        }

        // AI collision
        if (ballX >= 322 && ballY >= aiY && ballY <= aiY + 44) {
          speedX = -Math.abs(speedX);
          playSynthNotes([{ freq: 523, type: 'square', duration: 0.03, gain: 0.05 }]);
        }

        // Reset if scored
        if (ballX < 0 || ballX > 340) {
          ballX = 170;
          ballY = 100;
          speedX = -speedX;
        }

        // Smooth AI
        aiY += (ballY - (aiY + 22)) * 0.09;
        aiY = Math.max(0, Math.min(160, aiY));

        ctx.fillStyle = 'black';
        ctx.fillRect(0, 0, 340, 200);

        // Center line
        ctx.strokeStyle = '#444';
        ctx.setLineDash([4, 4]);
        ctx.beginPath();
        ctx.moveTo(170, 0);
        ctx.lineTo(170, 200);
        ctx.stroke();
        ctx.setLineDash([]);

        // Paddles & Ball
        ctx.fillStyle = 'white';
        ctx.fillRect(6, playerY, 7, 40); // Player
        ctx.fillRect(327, aiY, 7, 40);   // AI
        ctx.fillRect(ballX, ballY, 8, 8); // Ball

        requestAnimationFrame(update);
      }
      update();
    }

    window.onload = () => {
      // Restore saved wallpaper if any
      try {
        const savedType = localStorage.getItem('retrolink_bg_type');
        const savedVal = localStorage.getItem('retrolink_bg_val');
        if (savedType === 'color' && savedVal) {
          changeBg(savedVal);
        } else if (savedType === 'image' && savedVal) {
          setWallpaper(savedVal);
        }
      } catch (e) {}

      renderDesktop();
      updateClock();
      setInterval(updateClock, 1000);

      // Play soft startup sound on first user touch/click anywhere (browser autoplay policy)
      const playInitialBoot = () => {
        soundStartup();
        window.removeEventListener('click', playInitialBoot);
        window.removeEventListener('touchstart', playInitialBoot);
      };
      window.addEventListener('click', playInitialBoot);
      window.addEventListener('touchstart', playInitialBoot);

      // Open showcase window initially
      setTimeout(() => openWindow('projects'), 300);
    };
  </script>
</body>
</html>
