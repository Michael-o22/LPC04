<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="48" height="48" shape-rendering="crispEdges">
  <!-- Windows 98 System Tools (Golden Gear + Crossed Wrench & Screwdriver) -->

  <!-- Golden / Bronze Gear (Background) -->
  <!-- Gear Cogs (Teeth) -->
  <rect x="14" y="3" width="4" height="3" fill="#d4a017"/>
  <rect x="14" y="23" width="4" height="3" fill="#8a6808"/>
  <rect x="4" y="13" width="3" height="4" fill="#ffd700"/>
  <rect x="24" y="13" width="3" height="4" fill="#8a6808"/>
  <!-- Diagonal Cogs -->
  <rect x="7" y="6" width="3" height="3" fill="#ffd700"/>
  <rect x="21" y="6" width="3" height="3" fill="#b8860b"/>
  <rect x="7" y="20" width="3" height="3" fill="#b8860b"/>
  <rect x="21" y="20" width="3" height="3" fill="#604000"/>

  <!-- Gear Body Circle -->
  <circle cx="16" cy="14.5" r="8" fill="#d4a017"/>
  <circle cx="15.5" cy="14" r="7.5" fill="#ffd700"/>
  <circle cx="16" cy="14.5" r="4.5" fill="#404040"/>
  <circle cx="16" cy="14.5" r="3.5" fill="#181818"/>
  <circle cx="16" cy="14.5" r="8" fill="none" stroke="#000000" stroke-width="1"/>

  <!-- TOOL 1: Chrome Adjustable Wrench (Diagonal from Top-Left to Bottom-Right) -->
  <!-- Wrench Open Jaw Head (Top-Left) -->
  <path d="M4 6l4-4h3l3 3-2 2-2-1-2 2 1 2-2 2-3-3z" fill="#d4d0c8"/>
  <path d="M5 6l3-3h2l2 2-1 1-2-1-3 3z" fill="#ffffff"/>
  <path d="M7 9l1 1-1 1-2-2z" fill="#707070"/>
  <path d="M4 6l4-4h3l3 3-2 2-2-1-2 2 1 2-2 2-3-3z" fill="none" stroke="#000000" stroke-width="0.8"/>

  <!-- Wrench Handle -->
  <path d="M10 11l14 14 3-3-14-14z" fill="#c0c0c0"/>
  <path d="M10 11l14 14 1-1-14-14z" fill="#ffffff"/>
  <path d="M24 25l3-3-1-1-3 3z" fill="#505050"/>
  <path d="M10 11l14 14 3-3-14-14z" fill="none" stroke="#000000" stroke-width="0.8"/>
  <!-- Handle Grip Hole -->
  <circle cx="24.5" cy="24.5" r="1.5" fill="#000000"/>

  <!-- TOOL 2: Screwdriver (Diagonal from Top-Right to Bottom-Left) -->
  <!-- Screwdriver Flat Tip (Top-Right) -->
  <rect x="25" y="4" width="2" height="3" fill="#808080"/>
  <rect x="25" y="4" width="2" height="1" fill="#c0c0c0"/>
  <path d="M25 4h2v3h-2z" fill="none" stroke="#000000" stroke-width="0.8"/>

  <!-- Screwdriver Steel Shaft -->
  <path d="M18 11l7-7 1 1-7 7z" fill="#ffffff"/>
  <path d="M19 12l7-7 1 1-7 7z" fill="#a0a0a0"/>
  <path d="M18 11l8-8 2 2-8 8z" fill="none" stroke="#000000" stroke-width="0.8"/>

  <!-- Screwdriver Retro Red Handle (Bottom-Left) -->
  <!-- Handle Bulge -->
  <path d="M6 23l9-9 3 3-9 9z" fill="#cc1100"/>
  <path d="M7 23l8-8 1 1-8 8z" fill="#ff4422"/>
  <path d="M8 25l7-7 1 1-7 7z" fill="#ff7755"/>
  <path d="M11 27l5-5 1 1-5 5z" fill="#660000"/>
  <!-- Handle Flutes / Ridges (Windows 98 Grip Stripes) -->
  <line x1="8" y1="21" x2="15" y2="14" stroke="#ffffff" stroke-width="0.8"/>
  <line x1="9" y1="23" x2="16" y2="16" stroke="#440000" stroke-width="0.8"/>
  <line x1="10" y1="25" x2="17" y2="18" stroke="#ffffff" stroke-width="0.8"/>
  <!-- Handle Outline & Butt Cap -->
  <path d="M6 23l9-9 3 3-9 9z" fill="none" stroke="#000000" stroke-width="0.8"/>
  <rect x="5" y="25" width="3" height="3" fill="#808080" stroke="#000000" stroke-width="0.8"/>
</svg>
