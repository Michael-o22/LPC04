<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="48" height="48" shape-rendering="crispEdges">
  <!-- Windows 98 Database / Data Storage Cylinders (3-Tier Disk Array) -->

  <!-- Base Stand / Pedestal -->
  <path d="M4 27h24v3H4z" fill="#404040"/>
  <rect x="5" y="27" width="22" height="1" fill="#808080"/>
  <path d="M4 26h24v1H4zM3 27h1v3H3zM28 27h1v3h-1zM4 30h24v1H4z" fill="#000000"/>

  <!-- TIER 3 (Bottom Disc Cylinder) -->
  <!-- Cylinder Wall -->
  <rect x="6" y="20" width="20" height="6" fill="#c0c0c0"/>
  <rect x="6" y="20" width="3" height="6" fill="#ffffff"/>
  <rect x="23" y="20" width="3" height="6" fill="#707070"/>
  <!-- Outline -->
  <rect x="5" y="20" width="1" height="6" fill="#000000"/>
  <rect x="26" y="20" width="1" height="6" fill="#000000"/>
  <rect x="6" y="26" width="20" height="1" fill="#000000"/>
  <!-- LED Indicator Panel -->
  <rect x="10" y="22" width="2" height="2" fill="#00ff00"/>
  <rect x="13" y="22" width="2" height="2" fill="#00ffff"/>
  <rect x="16" y="22" width="6" height="2" fill="#202020"/>
  <rect x="17" y="22" width="4" height="1" fill="#404040"/>

  <!-- TIER 2 (Middle Disc Cylinder) -->
  <!-- Cylinder Wall -->
  <rect x="6" y="13" width="20" height="6" fill="#c0c0c0"/>
  <rect x="6" y="13" width="3" height="6" fill="#ffffff"/>
  <rect x="23" y="13" width="3" height="6" fill="#707070"/>
  <!-- Outline -->
  <rect x="5" y="13" width="1" height="6" fill="#000000"/>
  <rect x="26" y="13" width="1" height="6" fill="#000000"/>
  <rect x="6" y="19" width="20" height="1" fill="#000000"/>
  <!-- Disc Groove / Divide Line -->
  <rect x="6" y="19" width="20" height="1" fill="#000000"/>
  <!-- LED Indicator Panel -->
  <rect x="10" y="15" width="2" height="2" fill="#ffaa00"/>
  <rect x="13" y="15" width="2" height="2" fill="#00ff00"/>
  <rect x="16" y="15" width="6" height="2" fill="#202020"/>
  <rect x="17" y="15" width="4" height="1" fill="#404040"/>

  <!-- TIER 1 (Top Disc Cylinder) -->
  <!-- Cylinder Wall -->
  <rect x="6" y="6" width="20" height="6" fill="#c0c0c0"/>
  <rect x="6" y="6" width="3" height="6" fill="#ffffff"/>
  <rect x="23" y="6" width="3" height="6" fill="#707070"/>
  <!-- Outline -->
  <rect x="5" y="6" width="1" height="6" fill="#000000"/>
  <rect x="26" y="6" width="1" height="6" fill="#000000"/>
  <rect x="6" y="12" width="20" height="1" fill="#000000"/>
  <!-- LED Indicator Panel -->
  <rect x="10" y="8" width="2" height="2" fill="#00ff00"/>
  <rect x="13" y="8" width="2" height="2" fill="#ff2200"/>
  <rect x="16" y="8" width="6" height="2" fill="#202020"/>
  <rect x="17" y="8" width="4" height="1" fill="#404040"/>

  <!-- Top Disc Cap (Elliptical Shiny Surface) -->
  <path d="M8 3h16v1H8zM6 4h20v1H6zM5 5h22v1H5z" fill="#d4d0c8"/>
  <path d="M9 3h14v1H9zM7 4h8v1H7z" fill="#ffffff"/>
  <path d="M19 4h7v1h-7zM22 5h5v1h-5z" fill="#808080"/>
  <!-- Top Rim Black Border -->
  <path d="M8 2h16v1H8zM6 3h2v1H6zM24 3h2v1h-2zM5 4h1v1H5zM26 4h1v1h-1zM4 5h1v1H4zM27 5h1v1h-1z" fill="#000000"/>

  <!-- Database Center Spindle & Data Platter Glow (Navy/Cyan) -->
  <rect x="14" y="4" width="4" height="2" fill="#0055aa"/>
  <rect x="15" y="4" width="2" height="1" fill="#00ffff"/>
  <path d="M13 4h1v2h-1zM18 4h1v2h-1zM14 3h4v1h-4z" fill="#000000"/>

  <!-- Glowing Green Data Activity Burst (Top-Right) -->
  <rect x="23" y="1" width="2" height="1" fill="#00ff00"/>
  <rect x="24" y="0" width="1" height="3" fill="#00ff00"/>
  <rect x="22" y="2" width="1" height="1" fill="#55ff55"/>

  <!-- Authentic Windows 98 Shortcut Overlay Arrow (Bottom-Left) -->
  <rect x="1" y="22" width="9" height="9" fill="#ffffff" stroke="#000000" stroke-width="1"/>
  <path d="M2 28l3-3v2h2v-4h-4v2h2l-3 3z" fill="#0000aa"/>
  <path d="M3 27l2-2v1h2v-2h-2v1l-2 2z" fill="#000000"/>
</svg>
