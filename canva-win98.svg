<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="48" height="48" shape-rendering="crispEdges">
  <!-- Windows 98 Style Pixel-Art Icon: Canva (Visual Design & Presentation Studio) -->

  <!-- Outer 3D Beveled Design Board / Document (Windows 98 Style) -->
  <!-- Shadow Base -->
  <path d="M5 4h20v22H5z" fill="#000000"/>
  <!-- Beveled Border: Top/Left White highlight, Bottom/Right Dark shadow -->
  <rect x="4" y="3" width="20" height="1" fill="#ffffff"/>
  <rect x="4" y="3" width="1" height="22" fill="#ffffff"/>
  <rect x="23" y="4" width="1" height="21" fill="#808080"/>
  <rect x="5" y="24" width="19" height="1" fill="#808080"/>

  <!-- Document Inside Canvas: Canva Gradient (Teal/Cyan to Royal Blue) -->
  <rect x="5" y="4" width="18" height="20" fill="#00c4cc"/>
  <rect x="5" y="9" width="18" height="5" fill="#00a3cc"/>
  <rect x="5" y="14" width="18" height="5" fill="#0077b6"/>
  <rect x="5" y="19" width="18" height="5" fill="#023e8a"/>

  <!-- Folded Corner / Page Turn on Top-Right -->
  <polygon points="19,4 23,8 19,8" fill="#ffffff"/>
  <polygon points="19,4 23,8 23,4" fill="#808080"/>

  <!-- Canva Stylized Script "C" Monogram in Pixel Art (White with Soft Shadow) -->
  <!-- C Shadow -->
  <rect x="11" y="9" width="6" height="2" fill="#002244"/>
  <rect x="9" y="10" width="3" height="7" fill="#002244"/>
  <rect x="11" y="16" width="6" height="2" fill="#002244"/>
  <!-- C Body -->
  <rect x="10" y="8" width="6" height="2" fill="#ffffff"/>
  <rect x="8" y="9" width="3" height="7" fill="#ffffff"/>
  <rect x="10" y="15" width="6" height="2" fill="#ffffff"/>
  <!-- C Swash Tip -->
  <rect x="15" y="9" width="2" height="2" fill="#ffffff"/>
  <rect x="15" y="14" width="2" height="2" fill="#ffffff"/>
  <!-- Inner Cutout -->
  <rect x="11" y="10" width="4" height="5" fill="#0077b6"/>

  <!-- Designer Ruler / Triangle Tool (Bottom-Right overlay) -->
  <!-- Set-Square (Plastic Cyan/Yellow Ruler) -->
  <polygon points="16,17 29,29 16,29" fill="#000000"/>
  <polygon points="17,19 27,28 17,28" fill="#ffd700"/>
  <polygon points="17,19 25,27 17,27" fill="#fff3a8"/>
  <polygon points="19,23 23,26 19,26" fill="#000000"/>
  <polygon points="19,23 23,26 19,26" fill="#c0c0c0"/>
  
  <!-- Ruler Measurement Ticks (Pixel dashes) -->
  <rect x="18" y="27" width="1" height="1" fill="#403000"/>
  <rect x="20" y="27" width="1" height="1" fill="#403000"/>
  <rect x="22" y="27" width="1" height="1" fill="#403000"/>
  <rect x="24" y="27" width="1" height="1" fill="#403000"/>
  <rect x="17" y="21" width="1" height="1" fill="#403000"/>
  <rect x="17" y="23" width="1" height="1" fill="#403000"/>
  <rect x="17" y="25" width="1" height="1" fill="#403000"/>

  <!-- Vector Anchor Points (Four corners of canvas selection) -->
  <rect x="6" y="5" width="2" height="2" fill="#ffffff"/>
  <rect x="6" y="5" width="2" height="2" fill="none" stroke="#000000" stroke-width="0.5"/>
  <rect x="20" y="21" width="2" height="2" fill="#ffffff"/>
  <rect x="20" y="21" width="2" height="2" fill="none" stroke="#000000" stroke-width="0.5"/>
</svg>
