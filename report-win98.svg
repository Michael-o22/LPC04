<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="48" height="48" shape-rendering="crispEdges">
  <!-- Windows 98 Document Drop Shadow -->
  <path d="M7 6h19v23H7z" fill="#808080"/>
  <!-- Windows 98 Document Paper Page -->
  <path d="M5 4h15l6 6v18H5z" fill="#ffffff"/>
  <!-- Page Outer Border -->
  <path d="M5 3h15v1H5zM4 4h1v25H4zM5 29h21v1H5zM26 10h1v19h-1z" fill="#000000"/>
  <!-- Folded Corner (Dog-ear) -->
  <path d="M20 4v6h6" fill="#c0c0c0"/>
  <path d="M20 4h1v6h5v1H20z" fill="#000000"/>
  <path d="M21 5v4h4" fill="#ffffff"/>

  <!-- Document Header Banner / Title Bar (Navy) -->
  <rect x="7" y="6" width="11" height="2" fill="#000080"/>
  <rect x="7" y="9" width="17" height="1" fill="#808080"/>

  <!-- Pie Chart on Document -->
  <rect x="7" y="12" width="8" height="8" fill="#e0e0e0"/>
  <path d="M7 12h4v4H7z" fill="#0000aa"/>
  <path d="M11 12h4v4h-4z" fill="#ff0000"/>
  <path d="M7 16h4v4H7z" fill="#00aa00"/>
  <path d="M11 16h4v4h-4z" fill="#ffcc00"/>
  <!-- Pie Circular Outline -->
  <path d="M9 11h4v1H9zM8 12h1v1H8zM13 12h1v1h-1zM7 13h1v4H7zM14 13h1v4h-1zM8 17h1v1H8zM13 17h1v1h-1zM9 18h4v1H9z" fill="#000000"/>
  <!-- Center Divide Lines -->
  <path d="M11 12v6h-1v-6zM8 15h6v-1H8z" fill="#000000"/>

  <!-- Bar Charts on Document -->
  <!-- Bar 1 (Red) -->
  <rect x="17" y="16" width="2" height="4" fill="#ff0000"/>
  <rect x="17" y="15" width="2" height="1" fill="#ff8080"/>
  <!-- Bar 2 (Yellow) -->
  <rect x="20" y="14" width="2" height="6" fill="#ffcc00"/>
  <rect x="20" y="13" width="2" height="1" fill="#ffff80"/>
  <!-- Bar 3 (Blue) -->
  <rect x="23" y="12" width="2" height="8" fill="#0000ff"/>
  <rect x="23" y="11" width="2" height="1" fill="#8080ff"/>
  <!-- Bar Base Axis -->
  <path d="M16 20h10v1H16z" fill="#000000"/>

  <!-- Text / Caption Lines Below -->
  <rect x="7" y="22" width="18" height="1" fill="#808080"/>
  <rect x="7" y="24" width="15" height="1" fill="#808080"/>
  <rect x="7" y="26" width="10" height="1" fill="#808080"/>

  <!-- Authentic Windows 98 Shortcut Overlay Arrow (Bottom-Left) -->
  <rect x="2" y="21" width="9" height="9" fill="#ffffff" stroke="#000000" stroke-width="1"/>
  <path d="M3 27l3-3v2h2v-4h-4v2h2l-3 3z" fill="#0000aa"/>
  <path d="M4 26l2-2v1h2v-2h-2v1l-2 2z" fill="#000000"/>
</svg>
